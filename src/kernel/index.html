<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The import map is the only inline script; the build pins it by hash. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' '__IMPORTMAP_HASH__'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="Root-Cause Investigator: keep observations, hypotheses and evidence straight until the cause is proven.">
  <title data-text="pageTitle">Root-Cause Investigator</title>
  <link rel="stylesheet" href="./vendor/forma/all.css">
  <link rel="stylesheet" href="./vendor/folio/print.css" media="print">
  <link rel="stylesheet" href="./app.css">
  <script type="importmap">
    { "imports": { "limen/": "./vendor/limen/", "folio/": "./vendor/folio/" } }
  </script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <!-- Every decision below is made by the F# engine (src/engine/Shell.fs);
       this page only binds. Legality comes from the kernel's Transitions and
       Policy, never from this markup. -->
  <a class="ef-skip-link" href="#main" data-skip>Skip to main content</a>

  <header class="app-header" role="banner">
    <div class="app-header__inner">
      <p class="app-brand"><a href="#/">Root-Cause Investigator</a></p>
      <nav aria-label="Main">
        <ul class="app-nav">
          <li><a href="#/">Investigations</a></li>
          <li><a href="#/settings">GitHub settings</a></li>
          <li><a href="#/factory">How this app was built</a></li>
        </ul>
      </nav>
      <p class="app-connection" data-text="connection" data-bind-data-offline="isOffline">Online</p>
    </div>
  </header>

  <!-- Persistence and refusals are announced politely / assertively. -->
  <div class="app-live">
    <p class="app-notice" role="status" aria-live="polite" data-text="notice"></p>
  </div>

  <main id="main" tabindex="-1" class="app-main">
    <p class="app-boot" data-boot data-bind-hidden="booted">Starting the investigator…</p>
    <template data-if="isLoading">
      <p class="app-boot" role="status">Loading investigations saved on this device…</p>
    </template>

    <section class="app-refusals" aria-label="Why that could not be done" role="alert">
      <template data-if="hasRefusals">
        <div class="ef-fault ef-fault--inline" data-ef-intent="inline" data-ef-severity="warning">
          <div class="ef-fault__marker" aria-hidden="true">!</div>
          <div class="ef-fault__body">
            <p class="ef-fault__severity">Not allowed</p>
            <p class="ef-fault__title"><strong>That action was refused. Here is why:</strong></p>
            <ul class="refusal-list">
              <template data-each="refusals" data-key="id">
                <li class="refusal" data-testid="refusal">
                  <span class="refusal__message" data-text="message"></span>
                  <span class="refusal__meta">Code <code data-text="code"></code> · rule <span data-text="rule"></span> · <span data-text="fault"></span></span>
                </li>
              </template>
            </ul>
          </div>
          <div class="ef-recovery-actions" role="group" aria-label="Recovery actions">
            <button type="button" data-event="dismissRefusals">Dismiss</button>
          </div>
        </div>
      </template>
    </section>

    <!-- S01: home — list and start -->
    <template data-if="isHome">
      <div class="screen screen--home">
        <h1>Investigations</h1>
        <section class="ef-surface" aria-labelledby="start-title">
          <h2 id="start-title">Start an investigation</h2>
          <p>Describe what you observed in your own words. It is kept exactly as you write it.</p>
          <form data-event="start" class="form">
            <div class="ef-field">
              <label class="ef-field__label" for="start-observation">What did you observe?</label>
              <textarea id="start-observation" rows="4" required data-event="f.observation" data-bind-value="draft_observation"></textarea>
            </div>
            <div class="ef-field">
              <label class="ef-field__label" for="start-title-field">Short title (optional)</label>
              <input id="start-title-field" type="text" data-event="f.title" data-bind-value="draft_title">
            </div>
            <div class="ef-actions"><button type="submit" data-bind-disabled="startDisabled">Start investigation</button></div>
          </form>
        </section>
        <section aria-labelledby="list-title" class="ef-section">
          <h2 id="list-title">Saved on this device</h2>
          <template data-if="hasUnreadable">
            <div class="ef-alert" data-tone="attention" data-testid="unreadable">
              <div class="ef-alert__icon" aria-hidden="true">!</div>
              <div>
                <h3 class="ef-alert__title">Some saved investigations could not be read</h3>
                <ul class="plain-list">
                  <template data-each="unreadable" data-key="id"><li><strong data-text="title"></strong> — <span data-text="reason"></span></li></template>
                </ul>
              </div>
            </div>
          </template>
          <template data-if="noInvestigations">
            <p class="empty">No investigations yet. Start one above.</p>
          </template>
          <ul class="card-list">
            <template data-each="investigations" data-key="id">
              <li class="ef-card investigation-card">
                <h3 class="ef-card__title"><a data-bind-href="href" data-text="title"></a></h3>
                <p><span class="ef-status-lozenge" data-text="status"></span> <span data-text="updated"></span></p>
                <p class="muted" data-text="sync"></p>
                <p><a data-bind-href="reportHref">Report</a></p>
              </li>
            </template>
          </ul>
        </section>
      </div>
    </template>

    <!-- Not found (R9.8): never blank -->
    <template data-if="isMissing">
      <div class="screen screen--missing">
        <h1>Not found</h1>
        <p data-text="missingText"></p>
        <template data-if="hasMissingBack"><p><a class="ef-button" data-bind-href="missingBackHref">Back to the investigation</a></p></template>
        <p><a class="ef-button" href="#/">Go to your investigations</a></p>
      </div>
    </template>

    <!-- Settings (S23 persistence) -->
    <template data-if="isSettings">
      <div class="screen screen--settings">
        <h1>GitHub settings</h1>
        <p data-text="settingsSummary"></p>
        <form data-event="settings.save" class="form ef-surface">
          <div class="ef-field">
            <label class="ef-field__label" for="set-owner">Repository owner</label>
            <input id="set-owner" type="text" autocomplete="off" data-event="f.setOwner" data-bind-value="draft_setOwner">
          </div>
          <div class="ef-field">
            <label class="ef-field__label" for="set-repo">Repository name</label>
            <input id="set-repo" type="text" autocomplete="off" data-event="f.setRepo" data-bind-value="draft_setRepo">
          </div>
          <div class="ef-field">
            <label class="ef-field__label" for="set-branch">Branch</label>
            <input id="set-branch" type="text" autocomplete="off" data-event="f.setBranch" data-bind-value="draft_setBranch">
          </div>
          <div class="ef-field">
            <label class="ef-field__label" for="set-token">Access token</label>
            <span class="ef-field__description" id="set-token-help">Kept in memory for this session only: never saved on this device, never shown, never put in links, reports or GitHub files. After a reload you will be asked for it again. Leave empty to keep the token entered earlier in this session.</span>
            <input id="set-token" type="password" autocomplete="off" aria-describedby="set-token-help" data-event="f.setToken">
          </div>
          <div class="ef-actions">
            <button type="submit">Save settings</button>
            <button type="button" data-event="settings.clear">Disconnect GitHub</button>
          </div>
        </form>
        <p><a href="#/">Back to investigations</a></p>
      </div>
    </template>

    <!-- S20/S21: factory proof — the state of the factory when this site was built -->
    <template data-if="isFactory">
      <div class="screen screen--factory">
        <h1>How this app was built</h1>
        <div class="ef-alert" data-tone="attention">
          <div class="ef-alert__icon" aria-hidden="true">i</div>
          <div>
            <h2 class="ef-alert__title">Factory state at build time</h2>
            <p>This is a snapshot taken when the site was built, not a live view. It lists the requirements in scope, the slice of work each belongs to, and the state of each work item.</p>
          </div>
        </div>
        <p data-testid="factory-status" data-text="factoryStatus" role="status"></p>
        <template data-if="hasFactory">
          <div class="factory">
            <p>Experiment <strong data-text="factoryExperiment"></strong> · commit <code data-testid="factory-commit" data-text="factoryCommit"></code></p>
            <p data-testid="factory-build-status" data-text="factoryBuildStatus"></p>
            <p data-testid="factory-tests" data-text="factoryTests"></p>
            <section class="ef-section" aria-labelledby="slices-title">
              <h2 id="slices-title">Work items</h2>
              <ul class="plain-list">
                <template data-each="factoryWorkItems" data-key="id"><li data-testid="factory-work-item"><code data-text="id"></code> <span data-text="title"></span> — <strong data-text="status"></strong></li></template>
              </ul>
            </section>
            <section class="ef-section" aria-labelledby="reqs-title">
              <h2 id="reqs-title">Requirements in scope (<span data-text="factoryRequirementCount"></span>)</h2>
              <div class="table-scroll">
                <table class="factory-table">
                  <thead><tr><th scope="col">Requirement</th><th scope="col">Title</th><th scope="col">Kind</th><th scope="col">Slice</th><th scope="col">Slice state</th><th scope="col">Tests</th></tr></thead>
                  <tbody>
                    <template data-each="factoryRequirements" data-key="id"><tr data-testid="factory-requirement"><td><code data-text="id"></code></td><td data-text="title"></td><td data-text="scope"></td><td data-text="slice"></td><td data-text="status"></td><td data-text="coverage"></td></tr></template>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </template>
      </div>
    </template>

    <!-- S02: the investigation workspace -->
    <template data-if="isWorkspace">
      <div class="screen screen--workspace">
        <header class="ws-header">
          <p class="ef-eyebrow">Investigation</p>
          <h1 data-text="wsTitle"></h1>
          <p class="ws-meta">
            <span class="ef-status-lozenge" data-state="unknown" data-text="wsLifecycle"></span>
            <span>Version <span data-text="wsVersion"></span></span>
            <a data-bind-href="reportHref">Open report</a>
            <button type="button" data-event="copy.workspace">Copy link to this investigation</button>
          </p>
          <div class="persistence" aria-label="Where this investigation is saved">
            <p class="persistence__local" data-testid="local-status" data-text="localStatus"></p>
            <p class="persistence__remote" data-testid="remote-status"><span class="ef-status-lozenge" data-bind-data-state="remoteTone" data-text="remoteStatus"></span></p>
            <template data-if="hasSyncDetail"><p class="muted" data-text="syncDetail"></p></template>
            <template data-if="canRetrySync"><p><button type="button" data-event="sync.retry">Check GitHub again</button></p></template>
          </div>
        </header>

        <template data-if="hasFocus">
          <section class="focus-panel ef-surface" aria-labelledby="focus-title" data-testid="focus">
            <p class="ef-eyebrow" data-text="focusKind"></p>
            <h2 id="focus-title"><span data-text="focusLabel"></span> <span data-text="focusText"></span></h2>
            <p data-text="focusState"></p>
            <p><a data-bind-href="workspaceHref">Show the whole investigation</a></p>
          </section>
        </template>
        <div class="ws-grid">
          <section class="ws-panel ws-panel--wide" aria-labelledby="obs-title">
            <h2 id="obs-title">What was observed</h2>
            <blockquote class="observation" data-testid="observation" data-text="wsObservation"></blockquote>
            <p class="muted" data-text="wsObservationBy"></p>
          </section>

          <section class="ws-panel ws-panel--wide" aria-labelledby="todo-title" data-testid="outstanding">
            <h2 id="todo-title">Outstanding work</h2>
            <p class="outstanding-summary" data-text="outstandingSummary"></p>
            <ul class="ef-obligation-list" aria-label="Open obligations">
              <template data-each="outstanding" data-key="id">
                <li class="ef-obligation" data-ef-severity="warning" data-testid="outstanding-item">
                  <span class="ef-obligation__status" data-text="source"></span>
                  <div><strong data-text="message"></strong><p class="muted">Code <code data-text="code"></code></p></div>
                </li>
              </template>
            </ul>
          </section>

          <section class="ws-panel ws-panel--wide" aria-labelledby="hyp-title">
            <h2 id="hyp-title">Possible explanations (hypotheses)</h2>
            <form data-event="hyp.add" class="form form--inline">
              <div class="ef-field">
                <label class="ef-field__label" for="hyp-statement">New hypothesis</label>
                <input id="hyp-statement" type="text" data-event="f.hypStatement" data-bind-value="draft_hypStatement">
              </div>
              <div class="ef-field">
                <label class="ef-field__label" for="hyp-mechanism">How it would cause the problem (optional)</label>
                <input id="hyp-mechanism" type="text" data-event="f.hypMechanism" data-bind-value="draft_hypMechanism">
              </div>
              <div class="ef-actions"><button type="submit">Add hypothesis</button></div>
            </form>

            <fieldset class="change-box">
              <legend>To change a hypothesis: give the reason and the evidence, then press an action on it</legend>
              <div class="ef-field">
                <label class="ef-field__label" for="hyp-reason">Reason for the change</label>
                <input id="hyp-reason" type="text" data-event="f.hypReason" data-bind-value="draft_hypReason">
              </div>
              <div class="ef-select-field">
                <label class="ef-field__label" for="hyp-evidence">Evidence that caused it</label>
                <span class="ef-select">
                  <select class="ef-select__input" id="hyp-evidence" data-event="f.hypEvidence" data-bind-value="draft_hypEvidence">
                    <option value="">No evidence</option>
                    <template data-each="evidenceOptions" data-key="id"><option data-bind-value="id" data-text="label"></option></template>
                  </select>
                  <span class="ef-select__indicator" aria-hidden="true"></span>
                </span>
              </div>
            </fieldset>

            <template data-if="hasHypotheses"><p class="muted">The actions shown on each hypothesis are the ones allowed right now.</p></template>
            <ul class="card-list">
              <template data-each="hypotheses" data-key="id">
                <li class="ef-card hypothesis" data-testid="hypothesis" data-bind-data-tone="tone" data-bind-data-focused="isFocused">
                  <h3 class="ef-card__title"><span data-text="label"></span>: <span data-text="statement"></span></h3>
                  <p><span class="ef-status-lozenge" data-bind-data-state="tone" data-text="state" data-testid="hypothesis-state"></span></p>
                  <template data-if="hasMechanism"><p>Mechanism: <span data-text="mechanism"></span></p></template>
                  <p class="muted">Supported by: <span data-text="supportedBy"></span> · Contradicted by: <span data-text="contradictedBy"></span></p>
                  <p class="posture" data-testid="posture"><strong>Why this standing:</strong> <span data-text="posture"></span></p>
                  <p class="muted" data-text="lastChange"></p>
                  <div class="ef-cluster actions" role="group" aria-label="Allowed actions">
                    <button type="button" data-event="hyp.MarkPlausible" data-bind-hidden="hideMarkPlausible">Mark plausible</button>
                    <button type="button" data-event="hyp.MarkSupported" data-bind-hidden="hideMarkSupported">Mark supported</button>
                    <button type="button" data-event="hyp.MarkWeakened" data-bind-hidden="hideMarkWeakened">Mark weakened</button>
                    <button type="button" data-event="hyp.Falsify" data-bind-hidden="hideFalsify">Rule out (falsify)</button>
                    <button type="button" data-event="hyp.Supersede" data-bind-hidden="hideSupersede">Mark replaced</button>
                    <button type="button" data-event="hyp.Reopen" data-bind-hidden="hideReopen">Reopen</button>
                  </div>
                  <p class="unavailable" data-text="unavailable"></p>
                  <p class="item-links"><a data-bind-href="href">Link to this hypothesis</a> <button type="button" data-event="copy.h">Copy link</button></p>
                </li>
              </template>
            </ul>
            <h3>How the hypotheses changed</h3>
            <ol class="plain-list">
              <template data-each="hypothesisChanges" data-key="id"><li><span data-text="text"></span> <small class="muted" data-text="at"></small></li></template>
            </ol>
          </section>

          <section class="ws-panel" aria-labelledby="ai-title">
            <h2 id="ai-title">AI suggestions and challenges</h2>
            <div class="challenge" data-testid="challenge">
              <h3>Challenge the leading explanation</h3>
              <p class="muted">A rule-based helper, not AI: it applies fixed rules to the recorded state and can only suggest. You decide.</p>
              <p data-testid="challenge-status" data-text="challengeStatus"></p>
              <button type="button" data-event="challenge" data-bind-hidden="challengeHidden">Challenge the leading explanation</button>
              <h4>Questions to answer before concluding</h4>
              <ul class="plain-list">
                <template data-each="challengeQuestions" data-key="id"><li data-testid="challenge-question" data-text="text"></li></template>
              </ul>
            </div>
            <p class="muted">There is no live AI model here. Paste a suggestion an assistant gave you; it is recorded as the AI's, and only you can accept it.</p>
            <form data-event="ai.add" class="form">
              <div class="ef-field">
                <label class="ef-field__label" for="ai-text">Add AI-suggested hypothesis</label>
                <input id="ai-text" type="text" data-event="f.aiText" data-bind-value="draft_aiText">
              </div>
              <div class="ef-field">
                <label class="ef-field__label" for="ai-rationale">Why the AI suggested it (optional)</label>
                <input id="ai-rationale" type="text" data-event="f.aiRationale" data-bind-value="draft_aiRationale">
              </div>
              <div class="ef-actions"><button type="submit">Record AI suggestion</button></div>
            </form>
            <div class="ef-field">
              <label class="ef-field__label" for="ai-reason">Reason for rejecting a suggestion</label>
              <input id="ai-reason" type="text" data-event="f.aiReason" data-bind-value="draft_aiReason">
            </div>
            <ul class="card-list">
              <template data-each="proposals" data-key="id">
                <li class="ef-card" data-testid="proposal">
                  <p><span class="ef-badge" data-text="by"></span> <strong data-text="text"></strong></p>
                  <p class="muted" data-text="rationale"></p>
                  <p><span data-text="state"></span> <span data-text="decision"></span></p>
                  <template data-if="isActive">
                    <div class="ef-cluster" role="group" aria-label="Your decision">
                      <button type="button" data-event="ai.accept" data-text="acceptLabel">Accept</button>
                      <button type="button" data-event="ai.reject">Reject</button>
                    </div>
                  </template>
                </li>
              </template>
            </ul>
          </section>

          <section class="ws-panel" aria-labelledby="ev-title">
            <h2 id="ev-title">Evidence</h2>
            <form data-event="ev.add" class="form">
              <div class="ef-select-field">
                <label class="ef-field__label" for="ev-kind">Evidence is</label>
                <span class="ef-select">
                  <select class="ef-select__input" id="ev-kind" data-event="f.evKind" data-bind-value="draft_evKind">
                    <option value="text">Text I write or paste</option>
                    <option value="url">A link to a file or page</option>
                  </select>
                  <span class="ef-select__indicator" aria-hidden="true"></span>
                </span>
              </div>
              <div class="ef-field">
                <label class="ef-field__label" for="ev-content">Evidence (text or link)</label>
                <textarea id="ev-content" rows="3" data-event="f.evContent" data-bind-value="draft_evContent"></textarea>
              </div>
              <div class="ef-select-field">
                <label class="ef-field__label" for="ev-category">Kind of evidence</label>
                <span class="ef-select">
                  <select class="ef-select__input" id="ev-category" data-event="f.evCategory" data-bind-value="draft_evCategory">
                    <option value="DirectObservation">Direct observation</option>
                    <option value="Measurement">Measurement</option>
                    <option value="Log">Log</option>
                    <option value="Document">Document</option>
                    <option value="ExperimentResult">Experiment result</option>
                    <option value="Testimony">Testimony</option>
                    <option value="ExternalReference">External reference</option>
                  </select>
                  <span class="ef-select__indicator" aria-hidden="true"></span>
                </span>
              </div>
              <div class="ef-field">
                <label class="ef-field__label" for="ev-source">Where it came from (source)</label>
                <input id="ev-source" type="text" data-event="f.evSource" data-bind-value="draft_evSource">
              </div>
              <div class="ef-field">
                <label class="ef-field__label" for="ev-captured">Date captured (optional)</label>
                <input id="ev-captured" type="date" data-event="f.evCaptured" data-bind-value="draft_evCaptured">
              </div>
              <div class="ef-actions"><button type="submit">Add evidence</button></div>
            </form>
            <form data-event="ev.supersede" class="form">
              <div class="ef-select-field">
                <label class="ef-field__label" for="sup-old">Evidence to replace</label>
                <span class="ef-select">
                  <select class="ef-select__input" id="sup-old" data-event="f.supOld" data-bind-value="draft_supOld">
                    <option value="">Choose evidence</option>
                    <template data-each="evidenceOptions" data-key="id"><option data-bind-value="id" data-text="label"></option></template>
                  </select>
                  <span class="ef-select__indicator" aria-hidden="true"></span>
                </span>
              </div>
              <div class="ef-select-field">
                <label class="ef-field__label" for="sup-new">Replaced by</label>
                <span class="ef-select">
                  <select class="ef-select__input" id="sup-new" data-event="f.supNew" data-bind-value="draft_supNew">
                    <option value="">Choose evidence</option>
                    <template data-each="evidenceOptions" data-key="id"><option data-bind-value="id" data-text="label"></option></template>
                  </select>
                  <span class="ef-select__indicator" aria-hidden="true"></span>
                </span>
              </div>
              <div class="ef-field">
                <label class="ef-field__label" for="sup-reason">Why it is replaced</label>
                <input id="sup-reason" type="text" data-event="f.supReason" data-bind-value="draft_supReason">
              </div>
              <div class="ef-actions"><button type="submit">Replace evidence</button></div>
            </form>
            <ul class="card-list">
              <template data-each="evidence" data-key="id">
                <li class="ef-card" data-testid="evidence" data-bind-data-focused="isFocused">
                  <p><strong data-text="label"></strong> · <span data-text="category"></span> · <span data-text="checked"></span></p>
                  <template data-if="isText"><p class="evidence-text" data-text="content"></p></template>
                  <template data-if="isUrl"><p><a data-bind-href="url" data-text="content" rel="noopener noreferrer" target="_blank"></a></p></template>
                  <p class="muted">Source: <span data-text="source"></span> · captured <span data-text="captured"></span></p>
                  <p class="muted" data-text="provenance"></p>
                  <p class="muted" data-text="superseded"></p>
                  <p class="item-links"><a data-bind-href="href">Link to this evidence</a> <button type="button" data-event="copy.e">Copy link</button></p>
                </li>
              </template>
            </ul>
          </section>

          <section class="ws-panel" aria-labelledby="rel-title">
            <h2 id="rel-title">Link evidence to a hypothesis</h2>
            <form data-event="rel.add" class="form">
              <div class="ef-select-field">
                <label class="ef-field__label" for="rel-evidence">Evidence to link</label>
                <span class="ef-select">
                  <select class="ef-select__input" id="rel-evidence" data-event="f.relEvidence" data-bind-value="draft_relEvidence">
                    <option value="">Choose evidence</option>
                    <template data-each="evidenceOptions" data-key="id"><option data-bind-value="id" data-text="label"></option></template>
                  </select>
                  <span class="ef-select__indicator" aria-hidden="true"></span>
                </span>

                <span class="ef-select">
                  <select class="ef-select__input" id="concl-strength" data-event="f.conclStrength" data-bind-value="draft_conclStrength">
                    <option value="ConfirmedCause">Confirmed cause</option>
                    <option value="SupportedCause">Supported cause</option>
                    <option value="LeadingExplanation">Leading explanation</option>
                    <option value="PlausibleExplanation">Plausible explanation</option>
                    <option value="AcceptedWithResidualUncertainty">Accepted with remaining uncertainty</option>
                  </select>
                  <span class="ef-select__indicator" aria-hidden="true"></span>
                </span>
              </div>
              <div class="ef-select-field">
                <label class="ef-field__label" for="concl-cause">Cause concluded</label>
                <span class="ef-select">
                  <select class="ef-select__input" id="concl-cause" data-event="f.conclCause" data-bind-value="draft_conclCause">
                    <option value="">None</option>
                    <template data-each="causeOptions" data-key="id"><option data-bind-value="id" data-text="label"></option></template>
                  </select>
                  <span class="ef-select__indicator" aria-hidden="true"></span>
                </span>
              </div>
              <div class="ef-field">
                <label class="ef-field__label" for="concl-residual">Remaining uncertainty</label>
                <input id="concl-residual" type="text" data-event="f.conclResidual" data-bind-value="draft_conclResidual">
              </div>
              <div class="ef-actions"><button type="submit">Record conclusion</button></div>
            </form>
            <ul class="plain-list">
              <template data-each="conclusions" data-key="id"><li data-testid="conclusion"><strong data-text="statement"></strong> (<span data-text="strength"></span>) — remaining uncertainty: <span data-text="residual"></span></li></template>
            </ul>
            <div class="ef-obligation-panel resolve-panel" data-testid="resolve-panel">
              <p class="resolve-summary" data-text="resolveSummary"></p>
              <ul class="ef-obligation-list" aria-label="What still needs doing">
                <template data-each="resolutionBlockers" data-key="id">
                  <li class="ef-obligation" data-ef-severity="blocking" data-testid="resolve-blocker">
                    <span class="ef-obligation__status">Needed</span>
                    <div><strong data-text="message"></strong><p class="muted">Code <code data-text="code"></code> · rule <span data-text="rule"></span></p></div>
                  </li>
                </template>
              </ul>
              <div class="ef-cluster" role="group" aria-label="Investigation status actions">
                <button type="button" data-event="life.resolve" data-bind-hidden="lifeHide_resolve">Resolve investigation</button>
                <button type="button" data-event="life.activate" data-bind-hidden="lifeHide_activate">Mark in progress</button>
                <button type="button" data-event="life.awaitVerification" data-bind-hidden="lifeHide_awaitVerification">Mark waiting for verification</button>
                <button type="button" data-event="life.close" data-bind-hidden="lifeHide_close">Close</button>
              </div>
              <template data-if="wsIsClosed">
                <div class="form">
                  <div class="ef-field">
                    <label class="ef-field__label" for="reopen-basis">Why reopen</label>
                    <input id="reopen-basis" type="text" data-event="f.reopenBasis" data-bind-value="draft_reopenBasis">
                  </div>
                  <button type="button" data-event="life.reopen" data-bind-hidden="lifeHide_reopen">Reopen investigation</button>
                </div>
              </template>
            </div>
          </section>

          <section class="ws-panel ws-panel--wide" aria-labelledby="hist-title">
            <h2 id="hist-title">History</h2>
            <ol class="ef-timeline" aria-label="Investigation history, newest first">
              <template data-each="history" data-key="id">
                <li class="ef-timeline__item" data-testid="history-item">
                  <div class="ef-timeline__marker" aria-hidden="true"></div>
                  <div class="ef-timeline__content">
                    <div class="ef-timeline__meta"><span>#<span data-text="sequence"></span></span> <span data-text="at"></span> · <span data-text="actor"></span></div>
                    <p data-text="text"></p>
                  </div>
                </li>
              </template>
            </ol>
          </section>
        </div>
      </div>
    </template>

    <!-- S22: report preview (Folio) -->
    <template data-if="isReport">
      <div class="screen screen--report">
        <p class="no-print"><a data-bind-href="workspaceHref">Back to the investigation</a> · <button type="button" data-event="copy.report">Copy link to this report</button> · Use your browser's Print or Share → Print to save a PDF.</p>
        <ef-print-document class="report">
          <ef-print-title-page>
            <p class="ef-eyebrow" data-testid="report-kind" data-text="reportKind"></p>
            <h1 data-text="reportTitle"></h1>
            <p>Version <span data-text="reportVersion"></span> · snapshot <span class="ef-fault-reference"><code data-testid="report-digest" data-text="reportDigest"></code></span></p>
            <ef-print-callout>
              <p><strong>Observation as reported:</strong> <span data-text="reportObservation"></span></p>
            </ef-print-callout>
          </ef-print-title-page>
          <template data-if="hasUnresolved">
            <ef-print-section class="report-unresolved" data-testid="report-unresolved">
              <h2>Unresolved work</h2>
              <ul>
                <template data-each="reportUnresolved" data-key="id"><li><strong data-text="heading"></strong> <small data-text="detail"></small> <span class="ef-fault-reference"><code data-text="status"></code></span></li></template>
              </ul>
            </ef-print-section>
          </template>
          <template data-if="reportIsInterim">
            <ef-print-section class="report-outstanding" data-testid="report-outstanding">
              <h2>Outstanding work</h2>
              <p data-text="outstandingSummary"></p>
              <ul>
                <template data-each="outstanding" data-key="id"><li><strong data-text="source"></strong>: <span data-text="message"></span> <span class="ef-fault-reference"><code data-text="code"></code></span></li></template>
              </ul>
            </ef-print-section>
          </template>
          <ef-print-section>
            <template data-each="reportRows" data-key="id">
              <div class="report-row">
                <template data-if="first"><h2 data-text="section"></h2></template>
                <p><strong data-text="heading"></strong> <span class="muted" data-text="status"></span></p>
                <p data-text="detail"></p>
              </div>
            </template>
          </ef-print-section>
        </ef-print-document>
      </div>
    </template>
  </main>

  <footer class="app-footer" role="contentinfo">
    <p>Saved in this browser first; GitHub only when you connect it. <span data-build>Build __BUILD_SHA__</span></p>
  </footer>
</body>
</html>
